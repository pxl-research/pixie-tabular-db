name: pixie-tabular

services:
  tabular-api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    container_name: pixie_tabular_api
    restart: unless-stopped
    env_file:
      - ../../.env.dev
    depends_on:
      tabular-db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DB_HOST: tabular-db
    networks:
      - pixie-network

  tabular-db:
    build:
      context: ../../db
      dockerfile: Dockerfile
    container_name: pixie_tabular_postgres_db
    restart: unless-stopped
    env_file:
      - ../../.env.dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pixie-network

  adminer:
    image: adminer:latest
    container_name: pixie_tabular_adminer
    depends_on:
      - tabular-db
    env_file:
      - ../../.env.dev
    environment:
      ADMINER_DEFAULT_SERVER: tabular-db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - pixie-network

volumes:
  pgdata:

networks:
  pixie-network:
    external: true
    name: pixie-network
