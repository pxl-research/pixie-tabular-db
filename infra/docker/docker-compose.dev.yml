services:
  api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    container_name: pixie_postgres_api
    restart: unless-stopped
    env_file:
      - ../../.env.dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DB_HOST: db

  db:
    image: postgres:18-alpine
    container_name: pixie_postgres_db
    restart: unless-stopped
    env_file:
      - ../../.env.dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: pixie_postgres_adminer
    depends_on:
      - db
    env_file:
      - ../../.env.dev
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  pgdata:
